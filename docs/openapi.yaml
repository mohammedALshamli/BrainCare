components:
  schemas:
    AlertStatusEnum:
      enum:
      - none
      - pending
      - sent
      - acknowledged
      - failed
      type: string
      description: |-
        * `none` - None
        * `pending` - Pending
        * `sent` - Sent
        * `acknowledged` - Acknowledged
        * `failed` - Failed
    CaregiverPatientLink:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
          readOnly: true
        patient_email:
          type: string
          format: email
          readOnly: true
        caregiver:
          type: integer
          readOnly: true
        caregiver_email:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          default: true
        can_view:
          type: boolean
        can_edit_medications:
          type: boolean
        can_confirm_doses:
          type: boolean
        notify_missed_doses:
          type: boolean
        consent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - caregiver
      - caregiver_email
      - consent_at
      - created_at
      - id
      - is_active
      - patient
      - patient_email
      - revoked_at
      - updated_at
    CaregiverPatientLinkRequest:
      type: object
      properties:
        can_view:
          type: boolean
        can_edit_medications:
          type: boolean
        can_confirm_doses:
          type: boolean
        notify_missed_doses:
          type: boolean
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_identifier:
          type: string
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        token_preview:
          type: string
          readOnly: true
        device_name:
          type: string
          readOnly: true
        app_version:
          type: string
          readOnly: true
        os_version:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app_version
      - created_at
      - device_identifier
      - device_name
      - id
      - is_active
      - last_seen_at
      - metadata
      - os_version
      - platform
      - token_preview
      - updated_at
    DeviceRegistrationRequest:
      type: object
      properties:
        fcm_token:
          type: string
          writeOnly: true
          minLength: 20
          maxLength: 4096
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        device_identifier:
          type: string
          maxLength: 128
        device_name:
          type: string
          maxLength: 120
        app_version:
          type: string
          maxLength: 50
        os_version:
          type: string
          maxLength: 50
        metadata: {}
      required:
      - fcm_token
      - platform
    DoseActionRequest:
      type: object
      properties:
        client_event_id:
          type: string
          minLength: 1
          maxLength: 128
        client_recorded_at:
          type: string
          format: date-time
          nullable: true
        source:
          allOf:
          - $ref: '#/components/schemas/DoseActionSourceEnum'
          default: patient_app
      required:
      - client_event_id
    DoseActionSourceEnum:
      enum:
      - patient_app
      - caregiver_app
      - api
      type: string
      description: |-
        * `patient_app` - Patient app
        * `caregiver_app` - Caregiver app
        * `api` - API
    DoseEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_email:
          type: string
          format: email
          readOnly: true
        client_event_id:
          type: string
          readOnly: true
          nullable: true
        client_recorded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        server_received_at:
          type: string
          format: date-time
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/DoseEventSourceEnum'
          readOnly: true
        payload:
          readOnly: true
      required:
      - actor
      - actor_email
      - client_event_id
      - client_recorded_at
      - event_type
      - id
      - payload
      - server_received_at
      - source
    DoseEventSourceEnum:
      enum:
      - patient_app
      - caregiver_app
      - system
      - api
      - admin
      type: string
      description: |-
        * `patient_app` - Patient app
        * `caregiver_app` - Caregiver app
        * `system` - System
        * `api` - API
        * `admin` - Admin
    DoseMedication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        strength:
          type: string
          readOnly: true
        dosage_form:
          type: string
          readOnly: true
        dose_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        dose_unit:
          type: string
          readOnly: true
      required:
      - dosage_form
      - dose_amount
      - dose_unit
      - id
      - name
      - strength
    DoseOccurrence:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        medication:
          allOf:
          - $ref: '#/components/schemas/DoseMedication'
          readOnly: true
        schedule:
          allOf:
          - $ref: '#/components/schemas/DoseSchedule'
          readOnly: true
        scheduled_at:
          type: string
          format: date-time
          readOnly: true
        scheduled_date:
          type: string
          format: date
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DoseOccurrenceStatusEnum'
          readOnly: true
        alert_status:
          allOf:
          - $ref: '#/components/schemas/AlertStatusEnum'
          readOnly: true
        taken_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        skipped_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        snoozed_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        snooze_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alert_status
      - created_at
      - id
      - medication
      - schedule
      - scheduled_at
      - scheduled_date
      - skipped_at
      - snooze_count
      - snoozed_until
      - status
      - taken_at
      - updated_at
    DoseOccurrenceStatusEnum:
      enum:
      - pending
      - taken
      - skipped
      - overdue_unconfirmed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `taken` - Taken
        * `skipped` - Skipped
